name: Feature Request
description: Suggest an idea or feature enhancement for Veluna
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe your idea and use case in detail.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a problem or limitation in Veluna?
      placeholder: A clear and concise description of the problem or limitation you are experiencing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe how you envision this feature working in Veluna.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or features you have considered.
      placeholder: Any alternate designs, third-party workarounds, or workflows.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, screenshots, or mockups about the feature request here.
      placeholder: Additional details, UI mockups, links, or references.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and discussions to ensure this feature has not already been proposed.
          required: true
