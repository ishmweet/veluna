name: 'CI Check'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Download Windows bundled binaries
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          
          Write-Host "Downloading yt-dlp.exe..."
          curl.exe -fL -o src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          
          Write-Host "Downloading ffmpeg & ffprobe..."
          curl.exe -fL -o ffmpeg.zip https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z e ffmpeg.zip -osrc-tauri/binaries ffmpeg.exe ffprobe.exe -r -y
          Move-Item src-tauri/binaries/ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Move-Item src-tauri/binaries/ffprobe.exe src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -Force
          Remove-Item ffmpeg.zip -Force
          
          Write-Host "Fetching official mpv release..."
          $headers = @{ "User-Agent" = "veluna-ci" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $mpvUrl = $null
          try {
            $mpvRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/mpv-player/mpv/releases/latest" -Headers $headers
            $mpvAsset = $mpvRelease.assets | Where-Object { $_.name -like "*x86_64-pc-windows-msvc.zip" } | Select-Object -First 1
            if ($mpvAsset) { $mpvUrl = $mpvAsset.browser_download_url }
          } catch {
            Write-Host "API lookup error, using fallback URL..."
          }
          if (-not $mpvUrl) {
            $mpvUrl = "https://github.com/mpv-player/mpv/releases/download/v0.41.0/mpv-v0.41.0-x86_64-pc-windows-msvc.zip"
          }
          Write-Host "Downloading mpv from $mpvUrl..."
          curl.exe -fL -o mpv.zip $mpvUrl
          7z e mpv.zip -osrc-tauri/binaries mpv.exe -r -y
          Move-Item src-tauri/binaries/mpv.exe src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe -Force
          Remove-Item mpv.zip -Force
          
          Write-Host "Verified Windows binaries:"
          Get-ChildItem src-tauri/binaries

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Check Rust Backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
