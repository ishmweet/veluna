name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Download Windows bundled binaries
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          
          Write-Host "Downloading yt-dlp.exe..."
          curl.exe -fL -o src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          
          Write-Host "Downloading ffmpeg / ffprobe..."
          curl.exe -fL -o ffmpeg.zip https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          tar -xf ffmpeg.zip --wildcards "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe" --strip-components=2
          Move-Item ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Move-Item ffprobe.exe src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -Force
          Remove-Item ffmpeg.zip -Force
          
          Write-Host "Fetching latest mpv release info..."
          $headers = @{ "User-Agent" = "veluna-ci" }
          $mpvRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $mpvAsset = $mpvRelease.assets | Where-Object { $_.name -like "mpv-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
          Write-Host "Downloading mpv from $($mpvAsset.browser_download_url)..."
          curl.exe -fL -o mpv.7z $mpvAsset.browser_download_url
          7z e mpv.7z mpv.exe -osrc-tauri/binaries -y
          Move-Item src-tauri/binaries/mpv.exe src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe -Force
          Remove-Item mpv.7z -Force
          
          Write-Host "Verified Windows binaries:"
          Get-ChildItem src-tauri/binaries

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Veluna v__VERSION__'
          releaseBody: 'See the assets below to download Veluna for your platform.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
